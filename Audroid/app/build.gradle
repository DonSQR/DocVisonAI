plugins {
    id 'com.android.application'
}

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.example.conference"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
    }

    // OpenCV native libs
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Google Material
    implementation 'com.google.android.material:material:1.9.0'

    // PyTorch Mobile (for U²-Net + ESDNet 推理)
    implementation 'org.pytorch:pytorch_android:1.12.2'
    implementation 'org.pytorch:pytorch_android_torchvision:1.12.2'

    // iTextPDF
    implementation 'com.itextpdf:itextg:5.5.10'

    // RxPermissions + RxJava 1.x (从 JitPack — repo: tbruyelle/RxPermissions)
    implementation 'com.github.tbruyelle:RxPermissions:v0.9.3'
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'

    // ImageSelector (从 JitPack — 图片多选器, 替代旧的 TelegramGallery)
    implementation 'com.github.donkingliang:ImageSelector:2.2.0'

    // OpenCV Android SDK 3.4.10 (从 JitPack — 与你的 OPPO 兼容)
    implementation 'com.github.iamareebjamal:opencv-android:3.4.10'

    // PhotoView (图片手势缩放)
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    // Glide (图片加载)
    implementation 'com.github.bumptech.glide:glide:4.15.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
